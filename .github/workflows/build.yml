name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTEFACTS: build/OpenEDMKick_artefacts/Release

jobs:
  macos:
    if: false
    # macos-14 was retired on 2026-11-02. macos-15 is arm64 and still builds the universal binary.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Sign ad hoc
        run: |
          codesign --force --deep --sign - "$ARTEFACTS/VST3/openEDMKick.vst3"
          codesign --force --deep --sign - "$ARTEFACTS/AU/openEDMKick.component"
          codesign --force --deep --sign - "$ARTEFACTS/Standalone/openEDMKick.app"

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          echo "3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f  pluginval.zip" | shasum -a 256 -c -
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$ARTEFACTS/VST3/openEDMKick.vst3"

      - name: Package
        run: |
          mkdir -p dist
          ditto "$ARTEFACTS/VST3/openEDMKick.vst3" "dist/openEDMKick.vst3"
          ditto "$ARTEFACTS/AU/openEDMKick.component" "dist/openEDMKick.component"
          ditto "$ARTEFACTS/LV2/openEDMKick.lv2" "dist/openEDMKick.lv2"
          ditto "$ARTEFACTS/Standalone/openEDMKick.app" "dist/openEDMKick.app"
          python3 scripts/package_notices.py dist
          ditto -c -k dist openKicker-macOS.zip
          cp openKicker-macOS.zip openEDMKick-macOS.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openKicker-macOS
          path: |
            openKicker-macOS.zip
            openEDMKick-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate with pluginval
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          $hash = (Get-FileHash pluginval.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab") { throw "pluginval.zip SHA-256 mismatch: $hash" }
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate "$env:ARTEFACTS/VST3/openEDMKick.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "$env:ARTEFACTS/VST3/openEDMKick.vst3" dist/
          Copy-Item -Recurse "$env:ARTEFACTS/LV2/openEDMKick.lv2" dist/
          Copy-Item "$env:ARTEFACTS/Standalone/openEDMKick.exe" dist/
          python scripts/package_notices.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/* -DestinationPath openKicker-Windows.zip
          Copy-Item openKicker-Windows.zip openEDMKick-Windows.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openKicker-Windows
          path: |
            openKicker-Windows.zip
            openEDMKick-Windows.zip

  linux:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev xvfb xauth

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir -p dist
          cp -r "$ARTEFACTS/VST3/openEDMKick.vst3" "$ARTEFACTS/LV2/openEDMKick.lv2" dist/
          cp "$ARTEFACTS/Standalone/openEDMKick" dist/
          python3 scripts/package_notices.py dist
          (cd dist && zip -qr ../openKicker-Linux.zip .)
          cp openKicker-Linux.zip openEDMKick-Linux.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openKicker-Linux
          path: |
            openKicker-Linux.zip
            openEDMKick-Linux.zip

  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && (needs.macos.result == 'skipped' || needs.macos.result == 'success') && (needs.linux.result == 'skipped' || needs.linux.result == 'success') }}
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release_notes.py "${{ github.ref_name }}" > release-body.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/openKicker-*.zip
            dist/openEDMKick-*.zip
          body_path: release-body.md

  # Renders docs/screenshots/preview.png from the factory-default editor and commits
  # it on main. The macOS and Linux package jobs stay disabled; this job only builds
  # the test runner it needs for an offscreen snapshot.
  update-preview:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Skip when the editor sources did not change
        id: scope
        run: |
          before="${{ github.event.before }}"
          if [[ "$before" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(Source/|Tests/|assets/|CMakeLists\.txt|\.github/workflows/build\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No editor sources changed; leaving docs/screenshots/preview.png."
          fi

      - name: Install dependencies
        if: steps.scope.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev xvfb xauth fonts-dejavu-core

      - name: Configure
        if: steps.scope.outputs.changed == 'true'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build the editor snapshot runner
        if: steps.scope.outputs.changed == 'true'
        run: cmake --build build --target openedmkick_plugin_tests --parallel

      - name: Capture the factory default editor
        if: steps.scope.outputs.changed == 'true'
        run: OEK_PREVIEW_PNG="$PWD/docs/screenshots/preview.png" xvfb-run -a ./build/openedmkick_plugin_tests '[preview]'

      - name: Commit the refreshed preview
        if: steps.scope.outputs.changed == 'true'
        run: |
          if git diff --quiet -- docs/screenshots/preview.png; then
            echo "Preview matches this commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/preview.png
          git commit -m "docs: refresh preview screenshot [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
